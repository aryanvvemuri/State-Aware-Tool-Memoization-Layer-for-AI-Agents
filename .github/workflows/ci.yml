name: Axiom CI & Verification Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-download SentenceTransformer Model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run Pytest Suite (16 Deterministic Tests)
        run: |
          pytest -v tests/

      - name: Run Threshold Calibration Benchmark
        run: |
          python scripts/calibrate_threshold.py

      - name: Run End-to-End Demo Suite
        run: |
          python scripts/run_demo.py --fast

      - name: Publish Verification Report to Job Summary
        if: always()
        run: |
          echo "## ⚡ Axiom CI & Verification Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This report was generated automatically on GitHub Actions to provide public, reproducible proof of Axiom's test suite, calibration metrics, and demo performance." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f calibration_report.md ]; then
            cat calibration_report.md >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Automated Demo Execution Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python scripts/run_demo.py --fast >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
